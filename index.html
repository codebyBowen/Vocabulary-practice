<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Word Translation</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="https://fav.farm/🗣️" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="layout">
        <div class="main-content">
            <button id="dark-mode-btn" onclick="toggleDarkMode()"><i class="fas fa-moon"></i></button>
            <h1>Interactive Word Translation</h1>
            <div id="input-section">
                <textarea id="input-string" placeholder="Enter words with number bullet points, e.g.:
1. Hello 你好
2. world n 世界
3. lapse v 失效 衰退"></textarea>
                <button id="process-btn" onclick="processInput()">Process</button>
            </div>
            <div id="progress-bar-container" class="progress-bar-container" style="display: none;">
                <div class="close-progress" onclick="endPractice()"><i class="fas fa-times"></i></div>
                <div class="progress-bar">
                    <div class="progress"></div>
                </div>
                <div class="progress-number">0/0</div>
            </div>
            <div id="word-display"></div>
            <div id="translation"></div>
            <div class="btn-group">
                <button onclick="toggleTranslation()">Check</button>
                <button onclick="toggleAutoPronounce()">Auto-Pronounce: Off</button>
                <button id="loop-btn" onclick="toggleLoopPronunciation()">Loop Pronunciation: Off</button>
            </div>
            <div class="btn-group">
                <button class="icon-btn" onclick="previousWord()"><i class="fas fa-chevron-left"></i></button>
                <button onclick="masterWord()">I know this</button>
                <button onclick="notMasterWord()">Still learning</button>
                <button class="icon-btn" onclick="nextWord()"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="btn-group">
                <button id="switch-array-btn" onclick="switchArray()">Practice difficult words</button>
            </div>
        </div>
        <div class="sidebar">
            <h2>Words to Practice</h2>
            <ul id="not-mastered-list"></ul>
            <button id="download-csv" onclick="downloadCSV()">Download CSV</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
